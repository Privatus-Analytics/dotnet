name: Release

on:
  push:
    tags: ["v*"]

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write # lets NuGet/login swap a GitHub token for a short-lived NuGet key
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Check the tag matches the package version
        run: |
          version=$(dotnet msbuild src/Privatus.Analytics.AspNetCore/Privatus.Analytics.AspNetCore.csproj -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi

      - run: dotnet test Privatus.Analytics.AspNetCore.sln -c Release
      - run: dotnet pack src/Privatus.Analytics.AspNetCore/Privatus.Analytics.AspNetCore.csproj -c Release -o artifacts

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
